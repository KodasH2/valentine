<!app/index.html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my valentine? 💋</title>
    
    <link rel="icon" type="image/x-icon" href="public/heart.gif">

    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Handjet:wght@100..900&family=Tiny5&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>

<head>
    <style>
        .image-wrapper img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid #ff4d6d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="main-title">Priya, Will you be my valentine? 💖</h1>

        <div class="image-wrapper">
            <img src="Anshul.jpg" alt="Valentine Image" class="jpg">
        </div>

        <div class="buttons">
            <button id="yesBtn" class="btn">Yes</button>
            <button id="noBtn" class="btn">No</button>
        </div>

        <p id="responseText" class="message"></p>
    </div>

    <canvas id="heartsCanvas"></canvas>

    <script src="script.js"></script>
    
</body>
</html>
